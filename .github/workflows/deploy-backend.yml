name: Deploy CV Backend to Modal

# Triggers:
#   - Push to main when cv_backend/ or pyproject.toml changes
#   - Manual trigger via GitHub Actions UI (for forced redeploys)
on:
  push:
    branches: [main]
    paths:
      - "cv_backend/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      # Modal reads MODAL_TOKEN_ID and MODAL_TOKEN_SECRET from the environment
      # directly — no separate auth step needed.
      # Add these in: GitHub repo → Settings → Secrets and variables → Actions
      - name: Deploy to Modal
        run: uv run modal deploy cv_backend/infra/modal_runner.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
