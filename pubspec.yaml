name: padel_app
description: "Padel game analytics, statistics, and rating tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.8.4

  # Charts
  fl_chart: ^0.70.2

  # Local storage
  shared_preferences: ^2.3.4

  # Camera recording
  camera: ^0.11.0

  # Video compression (community fork — ffmpeg_kit_flutter is discontinued)
  ffmpeg_kit_flutter_new: ^4.1.0

  # Background upload (NSURLSession on iOS, WorkManager on Android)
  background_downloader: ^8.7.0

  # HTTP client (pre-signed URL fetch, processing job trigger)
  http: ^1.2.2

  # File system paths
  path_provider: ^2.1.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  generate: true
