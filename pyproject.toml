# Python project config for the CV backend service.
# Kept at repo root so hatchling can find cv_backend/ as a top-level package.
#
# Run locally (from repo root):
#   uv sync
#   uv run uvicorn cv_backend.api.main:app --reload
#
# Install heavy CV deps on GPU worker (Sprint 2+):
#   uv sync --extra cv

[project]
name = "cv-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.10.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "modal>=0.73.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
# Heavy CV deps — install only on GPU workers (Sprint 2+).
# Not included in base install to keep Modal cold-start fast.
# Local dev: uv.sources overrides padeldet to the editable local path.
# CI/Modal: installs from git.
cv = [
    "padeldet",             # local dev: resolved via [tool.uv.sources] editable path
    "torch>=2.3.0",
    "ultralytics>=8.3.0",   # YOLO11l
    "boxmot>=19.0.0,<20.0.0",  # DeepOCSORT + OSNet embeddings; pinned below 20 — see CV-001 in BUGS.md
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",          # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_backend"]

[tool.uv.sources]
padeldet = { path = "../padeldet", editable = true }
